name: in_app_location_kit
description: >-
  Turn on GPS in-app, request location permission, fetch coordinates and
  address — customizable UI, storage, maps, and Riverpod helpers.
version: 0.1.1
homepage: https://github.com/chaitanya-mhetre/in_app_location_kit
repository: https://github.com/chaitanya-mhetre/in_app_location_kit
issue_tracker: https://github.com/chaitanya-mhetre/in_app_location_kit/issues
documentation: https://github.com/chaitanya-mhetre/in_app_location_kit#readme

topics:
  - location
  - geolocator
  - permission
  - gps
  - flutter

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  location: ^7.0.1
  geocoding: ^3.0.0
  permission_handler: ^11.3.0
  shared_preferences: ^2.2.2
  google_maps_flutter: ^2.10.0
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
